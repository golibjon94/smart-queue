name: smart-queue

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: sq-timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-smartqueue}
    ports:
      # Lokal PostgreSQL 18 5432-portni band qilgan — Docker DB tashqariga 5433 da chiqadi
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      # DIQQAT: /docker-entrypoint-initdb.d ustiga mount qilinmaydi — u yerda
      # image'ning o'z skriptlari timescaledb kengaytmasini yaratadi.
      # Migratsiya + seed: scripts/migrate.ps1 (B1 da yoziladi)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartqueue} -d ${POSTGRES_DB:-smartqueue}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sq-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  python-ml:
    build: ../services/ml
    container_name: sq-python-ml
    environment:
      # Konteyner ichida DB xizmat nomi orqali, ichki 5432-portda
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-smartqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-smartqueue}
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    volumes:
      - ../services/ml/models:/app/models:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  dotnet-gateway:
    build: ../services/gateway
    container_name: sq-gateway
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-smartqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-smartqueue}
      ML_SERVICE_URL: http://python-ml:8000
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-dev_api_key_change_me}
      DASHBOARD_ORIGIN: http://localhost:${DASHBOARD_PORT:-4200}
    ports:
      - "${GATEWAY_PORT:-5080}:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
      python-ml:
        condition: service_started
    restart: unless-stopped
  # B6 da qo'shiladi: angular-nginx

volumes:
  timescale_data:
