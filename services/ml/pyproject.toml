[project]
name = "smartqueue-ml"
version = "0.1.0"
description = "smart-queue: sintetik generator, bashorat (LightGBM) va tavsiya dvigateli"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "forecasting*", "recommend*", "simulation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
