server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: barcha yo'llar index.html ga
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik fayllar keshi
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
