<app-dashboard-header
  [branchName]="store.branchName()"
  [connectionError]="store.connectionError()"
  [isPeak]="store.isPeak()"
  [scenarioLoading]="store.scenarioLoading()"
  (toggleScenario)="store.toggleScenario()"
/>

<app-kpi-cards
  class="mb-[18px]"
  [totalWaiting]="store.state()?.totalWaiting ?? null"
  [avgWaitMin]="store.state()?.avgWaitMin ?? null"
  [openCounters]="store.openCounters()"
  [totalCounters]="store.totalCounters()"
  [proposedCount]="store.proposedCount()"
/>

<div class="grid grid-cols-1 items-start gap-[18px] lg:grid-cols-[5fr_7fr]">
  <div class="flex min-w-0 flex-col gap-[18px]">
    <app-counters-panel [counters]="store.state()?.counters ?? []" />
    <app-queues-table [queues]="store.state()?.queues ?? []" />
    <app-qr-join-card [queues]="store.state()?.queues ?? []" [branchId]="branchId" />
    <app-virtual-tickets-panel
      [tickets]="store.virtualTickets()"
      (refresh)="onRefreshTickets()"
    />
    <app-anomalies-panel [anomalies]="store.anomalies()" />
  </div>

  <div class="flex min-w-0 flex-col gap-[18px]">
    <app-whatif-panel
      [currentCounters]="store.openCounters()"
      [simulation]="store.simulation()"
      [loading]="store.simulationLoading()"
      (simulate)="onSimulate($event)"
    />
    <app-forecast-chart
      [forecast]="store.forecast()"
      [hours]="store.forecast()?.points?.length ?? 24"
    />
    <app-recommendations-panel
      [recommendations]="store.recommendations()"
      [proposedCount]="store.proposedCount()"
      (respond)="onRespond($event)"
    />
    <app-feedback-panel
      [summary]="store.feedback()"
      [loading]="store.feedbackLoading()"
      (submit)="onFeedback($event)"
    />
  </div>
</div>

<div
  class="text-center"
  style="margin-top:28px;font-size:11px;color:var(--text-mut);font-family:var(--font-mono,'JetBrains Mono');"
>
  smart-queue · AI orchestration layer
</div>
