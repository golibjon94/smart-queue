<header class="topbar">
  <div class="brand">
    <h1>smart-queue</h1>
    <span class="branch">{{ state()?.branchName ?? '...' }}</span>
  </div>

  <div class="stats">
    @if (state(); as s) {
      <div class="stat">
        <span class="value">{{ s.totalWaiting }}</span>
        <span class="label">navbatda</span>
      </div>
      <div class="stat">
        <span class="value">~{{ s.avgWaitMin }}</span>
        <span class="label">daq kutish</span>
      </div>
    }
    @if (connectionError()) {
      <span class="conn-error">⚠ Gateway bilan aloqa yo'q</span>
    }
  </div>

  <button class="scenario" [class.peak]="isPeak" (click)="toggleScenario()">
    @if (isPeak) { ⏹ Normal holatga qaytish } @else { ▶ Demo: tushlik cho'qqisi }
  </button>
</header>

<main class="grid">
  <div class="col-left">
    <app-queue-status [state]="state()" />
  </div>
  <div class="col-right">
    <app-forecast-chart [forecast]="forecast()" />
    <app-recommendations [recs]="recs()" (respond)="onRespond($event)" />
  </div>
</main>
